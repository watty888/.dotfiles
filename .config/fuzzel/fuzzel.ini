[main]
font=JetBrainsMono Nerd Font:size=11
dpi-aware=yes
icon-theme=Papirus
width=40
lines=10
horizontal-pad=20
vertical-pad=15
inner-pad=10
# Colours come from the active light/dark theme: theme.ini is a symlink to
# themes/latte.ini or themes/mocha.ini, flipped by ~/.config/sway/scripts/theme-switch.sh.
include=~/.config/fuzzel/theme.ini

[border]
width=2
radius=10
