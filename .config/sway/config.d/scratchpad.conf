# Apps that open straight into the scratchpad, each with its own toggle key.
# The keys launch the app if it has no window yet (scripts/scratch-toggle.sh).
# Find an app's identifier with:
#   swaymsg -t get_tree | grep -E '"(app_id|class)"' | sort -u

# Spotify runs under XWayland, so it's matched by X11 class, not app_id.
for_window [class="^Spotify$"] move scratchpad, resize set 1200 760, move position center, scratchpad show
bindsym $mod+m exec ~/.config/sway/scripts/scratch-toggle.sh spotify

# Telegram is native Wayland. The title match keeps it to the main window
# ("Telegram" / "Telegram (3)"), so the media viewer and call windows open
# normally instead of vanishing into the scratchpad.
for_window [app_id="^org\.telegram\.desktop$" title="^Telegram"] move scratchpad, resize set 1000 720, move position center, scratchpad show
bindsym $mod+t exec ~/.config/sway/scripts/scratch-toggle.sh telegram

# Discord is native Wayland. Its main window title changes with the open
# channel ("Friends - Discord", "#general | Server - Discord"); the rule only
# fires once per window, so that's harmless.
for_window [app_id="^discord$"] move scratchpad, resize set 1300 820, move position center, scratchpad show
bindsym $mod+c exec ~/.config/sway/scripts/scratch-toggle.sh discord

# Thunar can have several windows open. Matching the "<folder> - Thunar" title
# catches browser windows only, so file-operation progress, properties and
# rename dialogs open normally. Every new browser window does go to the
# scratchpad, though, and $mod+x shows/hides all of them together.
for_window [app_id="^thunar$" title=" - Thunar$"] move scratchpad, resize set 1100 700, move position center, scratchpad show
bindsym $mod+x exec ~/.config/sway/scripts/scratch-toggle.sh thunar
