# Catppuccin Latte colours for sway. Selected by ~/.config/sway/scripts/theme-switch.sh,
# which points ~/.config/sway/theme.conf at this file. Gold #fbc628 is the focus accent in both themes.

# Solid fallback shown until the wallpaper slideshow starts.
output * bg #eff1f5 solid_color

# Columns: title border, title background, title text, split indicator, window border.
# With pixel borders (see ../config) only the last two show, plus tab titles in
# tabbed/stacked containers. Only the focused window gets an outline, in muted
# overlay0 rather than gold (a gold frame was too loud); the others' borders are
# fully transparent (#00000000), so they melt into the gaps. Gold stays on the
# active tab/stack title, like waybar's focused workspace pill.
client.focused          #fbc628 #fbc628 #4c4f69 #9ca0b0 #9ca0b0
client.focused_inactive #ccd0da #eff1f5 #6c6f85 #00000000 #00000000
client.unfocused        #e6e9ef #eff1f5 #9ca0b0 #00000000 #00000000
client.urgent           #eff1f5 #d20f39 #ffffff #d20f39 #d20f39
