# Catppuccin Mocha colours for sway. Selected by ~/.config/sway/scripts/theme-switch.sh,
# which points ~/.config/sway/theme.conf at this file. Gold #fbc628 is the focus accent in both themes.

# Solid fallback shown until the wallpaper slideshow starts.
output * bg #1e1e2e solid_color

client.focused          #585b70 #fbc628 #1e1e2e #585b70 #585b70
client.focused_inactive #313244 #1e1e2e #a6adc8 #313244 #313244
client.unfocused        #181825 #1e1e2e #6c7086 #181825 #181825
client.urgent           #1e1e2e #f38ba8 #ffffff #f38ba8 #f38ba8
