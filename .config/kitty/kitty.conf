# kitty — terminal for the sway session.
#
# sway launches this as `kitty zsh` (see .config/sway/config: set $term).
# Palette is Catppuccin Mocha, matching .config/sway/config and
# .config/fuzzel/fuzzel.ini so the whole desktop reads as one theme.

# ── Font ────────────────────────────────────────────────────────────────────
# Same family and size as fuzzel.ini. The Nerd Font build is required: the
# shell prompt is powerlevel10k, which draws glyphs from the private use area.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Ligatures are pleasant in prose but hide the cursor position mid-token, so
# disable them only where the cursor is.
disable_ligatures cursor

# ── Window ──────────────────────────────────────────────────────────────────
window_padding_width      8
confirm_os_window_close   0
hide_window_decorations   yes

# Slight transparency to sit with fuzzel's 1e1e2ecc panel. Kept high so text
# stays readable over a busy wallpaper; dynamic_ lets Ctrl+Shift+A>M adjust it.
background_opacity         0.95
dynamic_background_opacity yes

# ── Selection / clipboard ───────────────────────────────────────────────────
# Selecting with the mouse copies straight to the system clipboard, the way a
# terminal is expected to behave. kitty's default is `no`, which leaves the
# selection in PRIMARY only — so middle-click paste works but Ctrl+V and
# pasting into other apps silently get nothing.
copy_on_select clipboard

# Drop trailing whitespace from copied lines, but only where it is clearly
# padding rather than part of the content (so block selections survive).
strip_trailing_spaces smart

# Treat these as part of a word when double-clicking, so paths, URLs and
# flags select in one go instead of fragmenting at every punctuation mark.
select_by_word_characters @-./_~?&=%+#

# ── Bell ────────────────────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.1

# ── Scrollback ──────────────────────────────────────────────────────────────
scrollback_lines 10000
# `v` is nvim (see .config/zsh/.zshrc), so page scrollback in the same editor
# the rest of the setup uses.
scrollback_pager nvim -c 'set ft=man nomod nolist nonumber' -

# ── Tabs ────────────────────────────────────────────────────────────────────
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
active_tab_foreground #1e1e2e
active_tab_background #fbc628
active_tab_font_style bold
inactive_tab_foreground #a6adc8
inactive_tab_background #313244

# ── Cursor ──────────────────────────────────────────────────────────────────
cursor_shape           beam
cursor_blink_interval  0.5

# ── Colours: Catppuccin Mocha ───────────────────────────────────────────────
background            #1e1e2e
foreground            #cdd6f4
selection_background  #585b70
selection_foreground  #cdd6f4
cursor                #f5e0dc
cursor_text_color     #1e1e2e
url_color             #89b4fa

# #fbc628 is the gold sway uses for the focused window border, reused here so
# the active split and the active tab agree.
active_border_color   #fbc628
inactive_border_color #313244
bell_border_color     #f38ba8

# normal
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de

# bright
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# ── Keys ────────────────────────────────────────────────────────────────────
# Mod4 belongs to sway, so kitty stays on its ctrl+shift defaults and only adds
# what sway does not already bind.
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+plus  change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0
