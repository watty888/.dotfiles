# kitty on macOS — included from kitty.conf via `include ${KITTY_OS}.conf`.

# kitty only accepts fonts the OS flags as monospaced. Arch's fontconfig flags
# "JetBrainsMono Nerd Font" that way; macOS CoreText does not (its wide icon
# glyphs break fixed pitch), so kitty silently fell back to Menlo — no
# ligatures, no error. The "Mono" variant is the same font with icons squeezed
# to one cell, flagged monospaced, ligatures intact.
font_family JetBrainsMono Nerd Font Mono

# Retina panels render 11pt far smaller than the Linux laptop does.
font_size 14.0

# kitty.conf sets `yes` for sway, which draws its own borders. On macOS the
# close/minimise/zoom buttons live in the title bar, so both `yes` and
# `titlebar-only` remove them. Keep the title bar, coloured like the terminal
# background so it reads as part of the window.
hide_window_decorations no
macos_titlebar_color    background

# Let Option act as Alt (Meta) so zsh and nvim Alt bindings work, as on Linux.
macos_option_as_alt yes

# Closing the last window quits the app, matching how the sway session behaves.
macos_quit_when_last_window_closed yes
